<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lappland Pet</title>
<style>
    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        cursor: default;
        user-select: none;
        -webkit-app-region: no-drag;
    }
    canvas {
        display: block;
        background: transparent;
        position: absolute;
        top: 0;
        left: 0;
    }
    #pet-canvas {
        pointer-events: none;
        z-index: 10;
    }
</style>
</head>
<body>
    <canvas id="pet-canvas"></canvas>
    <script src="/libs/pixi.js/pixi.min.js"></script>
    <script src="/libs/pixi-spine/pixi-spine.umd.js"></script>
    <script src="/config.js"></script>
    <script src="/pet.js"></script>
</body>
</html>
